name: Aidence
description: >-
  Aidence is a radiology AI company founded in Amsterdam in 2015 that builds
  clinical AI for the lung cancer pathway. Its flagship product, Veye Lung
  Nodules (now DeepHealth Lung), is a CE-marked AI solution that detects,
  classifies, quantifies, and measures growth of pulmonary nodules on chest CT
  scans, and is the AI of choice in NHS England's Targeted Lung Health Checks
  screening programme. Aidence was acquired by RadNet in 2022 and now operates
  under the DeepHealth brand; aidence.com redirects to deephealth.com/aidence.
  The product integrates with hospital systems over DICOM/PACS via the Veye
  Engine rather than a public developer REST API — no public API, developer
  portal, or SDKs are published. This profile captures the company's identity
  plus its probed security and disclosure posture.
